<section class="setup-card" aria-labelledby="setup-title">
  <div class="setup-head">
    <h2 id="setup-title">1) Ton setup</h2>
    <p class="setup-sub">
      Renseigne ta config : on te dira <strong>OK</strong>, <strong>Limite</strong> ou <strong>Pas recommandé</strong>.
    </p>
  </div>

  <form class="setup-form" id="setupForm">
    <div class="field">
      <label for="systeme">Système</label>
      <select id="systeme" name="systeme">
        <option>Windows</option>
        <option>macOS</option>
        <option>Linux</option>
      </select>
    </div>

    <div class="field">
      <label for="cpu">CPU (processeur)</label>
      <select id="cpu" name="cpu"></select>
    </div>

    <div class="field">
      <label for="gpu">GPU (carte graphique)</label>
      <select id="gpu" name="gpu"></select>
    </div>

    <div class="field">
      <label for="ram">RAM</label>
      <select id="ram" name="ram">
        <option>8 Go</option>
        <option selected>16 Go</option>
        <option>32 Go</option>
        <option>64 Go</option>
      </select>
    </div>

    <div class="field">
      <label for="storage">Stockage</label>
      <select id="storage" name="storage">
        <option>HDD</option>
        <option selected>SSD</option>
        <option>NVMe</option>
      </select>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-primary" id="btnAnalyze">Analyser</button>
      <button type="button" class="btn btn-ghost" id="btnReset">Réinitialiser</button>
    </div>

    <div class="setup-note" role="note">
      <div class="note-title">Note</div>
      <ul class="note-list">
        <li><span class="chip ok">✅</span> usage standard fluide</li>
        <li><span class="chip warn">⚠️</span> ça tourne, mais il faudra optimiser</li>
        <li><span class="chip bad">❌</span> pas recommandé pour cet usage</li>
      </ul>
    </div>
  </form>
</section>
