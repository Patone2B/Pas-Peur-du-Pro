<div class="setup-scope">
  <section class="setup-card">
    <div class="setup-head">
      <h2>🖥️ Analyse de configuration</h2>
      <p class="setup-sub">Entre ta config : on te dit si c’est ✅ OK, ⚠️ Limite, ou ❌ pas recommandé.</p>
    </div>

    <div class="setup-form">
      <div class="field">
        <label for="os">Système</label>
        <select id="os">
          <option value="windows" selected>Windows</option>
          <option value="mac">macOS</option>
          <option value="linux">Linux</option>
        </select>
        <p class="help">Estimation “débutant-friendly”. Certains logiciels dépendent aussi des drivers.</p>
      </div>

      <div class="field">
        <label for="ram">RAM</label>
        <select id="ram">
          <option value="8">8 Go</option>
          <option value="16" selected>16 Go</option>
          <option value="32">32 Go</option>
          <option value="64">64 Go</option>
        </select>
      </div>

      <div class="field">
        <label for="cpu">CPU (processeur)</label>
        <select id="cpu"></select>
      </div>

      <div class="field">
        <label for="gpu">GPU (carte graphique)</label>
        <select id="gpu"></select>
      </div>

      <div class="field">
        <label for="storage">Stockage</label>
        <select id="storage">
          <option value="hdd">HDD (disque dur)</option>
          <option value="ssd" selected>SSD</option>
          <option value="nvme">NVMe</option>
        </select>
      </div>

      <div class="actions">
        <button id="analyzeBtn" class="btn btn-primary" type="button">Analyser</button>
        <button id="resetBtn" class="btn btn-ghost" type="button">Réinitialiser</button>
      </div>

      <div class="setup-note">
        <div class="note-title">Note</div>
        <ul class="note-list">
          <li><span class="chip">✅</span> usage standard fluide</li>
          <li><span class="chip">⚠️</span> ça tourne, mais il faudra optimiser</li>
          <li><span class="chip">❌</span> pas recommandé pour cet usage</li>
        </ul>
      </div>
    </div>

    <div id="statusBox" class="statusbox hidden"></div>
    <div id="results" class="results"></div>
  </section>
</div>
